<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOCKPUNCH — Cheat Sheet</title>
<style>
  /* Self-hosted JetBrains Mono (SIL OFL) — no third-party font requests, per site policy.
     'Space Grotesk' is not self-hosted; it falls back to the system sans-serif stack. */
  @font-face { font-family:'JetBrains Mono'; src:url('/static/fonts/JetBrainsMono-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'JetBrains Mono'; src:url('/static/fonts/JetBrainsMono-Bold.woff2') format('woff2'); font-weight:600 700; font-display:swap; }

  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2332;
    --border: #1e2d3d;
    --text: #c9d1d9;
    --text-dim: #6b7b8d;
    --accent: #2496ED;
    --accent2: #326CE5;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #f0883e;
    --cyan: #39d0d8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ──────────────────────────────── */
  .header {
    background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 2rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.03em;
  }

  .tagline {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 0.2rem;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Search ──────────────────────────────── */
  .search-container {
    position: relative;
    max-width: 600px;
  }

  .search-container::before {
    content: '⌘';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 1rem;
  }

  .search {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.2s;
  }

  .search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(36, 150, 237, 0.15);
  }

  .search::placeholder { color: var(--text-dim); }

  /* ── Filter tabs ─────────────────────────── */
  .filters {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0.35rem 0.85rem;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── Main content ────────────────────────── */
  .content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* ── Category sections ───────────────────── */
  .category {
    margin-bottom: 2.5rem;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .category-icon { font-size: 1.3rem; }

  .category-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .category-count {
    font-size: 0.7rem;
    background: var(--surface2);
    color: var(--text-dim);
    padding: 0.15rem 0.5rem;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Command rows ────────────────────────── */
  .cmd-grid {
    display: grid;
    gap: 2px;
  }

  .cmd-row {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
    gap: 1rem;
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    transition: background 0.1s;
    align-items: baseline;
  }

  .cmd-row:hover {
    background: var(--surface);
  }

  .cmd-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--green);
    word-break: break-all;
    cursor: pointer;
    position: relative;
  }

  .cmd-code:hover::after {
    content: '📋 click to copy';
    position: absolute;
    top: -1.6rem;
    left: 0;
    font-size: 0.65rem;
    color: var(--accent);
    background: var(--surface2);
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    white-space: nowrap;
  }

  .cmd-code.copied::after {
    content: '✓ copied!';
    color: var(--green);
  }

  .cmd-desc {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  /* ── Subcategory headers ─────────────────── */
  .sub-header {
    color: var(--yellow);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 0.75rem 0 0.25rem 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ── One-liner blocks ────────────────────── */
  .oneliner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .oneliner:hover { border-color: var(--accent); }

  .oneliner-desc {
    font-size: 0.75rem;
    color: var(--yellow);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 0.35rem;
  }

  .oneliner-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--green);
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* ── Stats bar ───────────────────────────── */
  .stats {
    text-align: center;
    padding: 1.5rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  .no-results {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .no-results .emoji { font-size: 3rem; margin-bottom: 1rem; }

  .highlight { background: rgba(36, 150, 237, 0.25); border-radius: 2px; padding: 0 1px; }

  /* ── Toast notification ──────────────────── */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--green);
    color: #000;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s;
    z-index: 200;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 768px) {
    .cmd-row { grid-template-columns: 1fr; gap: 0.2rem; }
    .header { padding: 1.5rem 1rem 1rem; }
    .content { padding: 1rem; }
  }
</style>
</head>

// ── Count total commands ────────────────
let totalCmds = 0;
DATA.forEach(cat => {
  if (cat.commands) totalCmds += cat.commands.filter(c => c.cmd).length;
  if (cat.oneliners) totalCmds += cat.oneliners.length;
});

// ── Render Filters ──────────────────────
const filtersEl = document.getElementById('filters');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = `All (${totalCmds})`;
allBtn.dataset.filter = 'all';
filtersEl.appendChild(allBtn);

DATA.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  const count = (cat.commands ? cat.commands.filter(c=>c.cmd).length : 0) + (cat.oneliners ? cat.oneliners.length : 0);
  btn.textContent = `${cat.icon} ${cat.title} (${count})`;
  btn.dataset.filter = cat.id;
  filtersEl.appendChild(btn);
});

// ── State ───────────────────────────────
let activeFilter = 'all';
let searchQuery = '';

// ── Render ──────────────────────────────
function highlight(text, query) {
  if (!query) return text;
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<span class="highlight">$1</span>');
}

function render() {
  const content = document.getElementById('content');
  const q = searchQuery.toLowerCase();
  let html = '';
  let visibleCount = 0;

  DATA.forEach(cat => {
    if (activeFilter !== 'all' && activeFilter !== cat.id) return;

    let catHtml = '';
    let catCount = 0;

    if (cat.commands) {
      cat.commands.forEach(item => {
        if (item.sub) {
          if (!q || cat.commands.some(c => c.cmd && (c.cmd.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q)))) {
            catHtml += `<div class="sub-header">${item.sub}</div>`;
          }
          return;
        }
        if (q && !item.cmd.toLowerCase().includes(q) && !item.desc.toLowerCase().includes(q)) return;
        catHtml += `<div class="cmd-row">
          <div class="cmd-code" onclick="copyCmd(this, '${item.cmd.replace(/'/g, "\\'")}')">${highlight(item.cmd, searchQuery)}</div>
          <div class="cmd-desc">${highlight(item.desc, searchQuery)}</div>
        </div>`;
        catCount++;
      });
    }

    if (cat.oneliners) {
      cat.oneliners.forEach(item => {
        if (q && !item.code.toLowerCase().includes(q) && !item.desc.toLowerCase().includes(q)) return;
        catHtml += `<div class="oneliner" onclick="copyCmd(this, \`${item.code.replace(/`/g, '\\`')}\`)">
          <div class="oneliner-desc"># ${highlight(item.desc, searchQuery)}</div>
          <div class="oneliner-code">${highlight(item.code, searchQuery)}</div>
        </div>`;
        catCount++;
      });
    }

    if (catCount > 0) {
      html += `<div class="category">
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>
          <span class="category-title" style="color:${cat.color}">${cat.title}</span>
          <span class="category-count">${catCount}</span>
        </div>
        <div class="cmd-grid">${catHtml}</div>
      </div>`;
      visibleCount += catCount;
    }
  });

  if (visibleCount === 0) {
    html = `<div class="no-results">
      <div class="emoji">🥊</div>
      <div>No commands found for "${searchQuery}"</div>
      <div style="margin-top:0.5rem;font-size:0.8rem">Try a different search term</div>
    </div>`;
  }

  html += `<div class="stats">${visibleCount} commands shown of ${totalCmds} total — DOCKPUNCH v1.0</div>`;
  content.innerHTML = html;
}

// ── Copy to clipboard ───────────────────
function copyCmd(el, text) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); el.classList.remove('copied'); }, 1500);
  });
}

// ── Events ──────────────────────────────
document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

document.getElementById('filters').addEventListener('click', (e) => {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  render();
});

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('search').value = '';
    searchQuery = '';
    render();
  }
});

// Initial render
render();
</script>
